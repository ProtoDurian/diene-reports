name: Visibility relay

# Tells reports.atomi.cloud which ProtoDurian repos are public. GitHub's API is called from here (own token, own rate limit),
# not from Cloudflare, and the result is posted with this run's OIDC token. No App key, no stored secret.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: visibility-relay
  cancel-in-progress: false

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: List public repos and post them
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OWNER: ProtoDurian
          AUDIENCE: diene-reports
          ENDPOINT: https://reports.atomi.cloud/api/v1/visibility
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT

          # 1. every public repo of the org, page by page; any non-200 aborts without posting
          page=1
          while :; do
            code="$(curl -sS --retry 3 --retry-delay 2 --max-time 30 -o "$work/page.json" -w '%{http_code}' \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/orgs/${OWNER}/repos?type=public&per_page=100&page=${page}")"
            if [ "$code" != "200" ]; then
              echo "::error::GitHub answered HTTP ${code} for page ${page}; not posting"
              exit 1
            fi
            n="$(jq 'if type == "array" then length else error("not an array") end' "$work/page.json")"
            [ "$n" -gt 0 ] || break
            jq -c '[.[] | {id: .id, full_name: .full_name}]' "$work/page.json" > "$work/p${page}.json"
            page=$((page + 1))
            if [ "$page" -gt 100 ]; then
              echo "::error::more than 10000 repos; not posting"
              exit 1
            fi
          done

          # 2. the report (complete: every page was read)
          if [ "$page" -gt 1 ]; then
            list="$(jq -cs 'add' "$work"/p*.json)"
          else
            list='[]'
          fi
          jq -cn --arg owner "$OWNER" --argjson list "$list" \
            '{schema: "diene-visibility/v1", owner: $owner, complete: true, public: $list}' > "$work/body.json"
          echo "public repos: $(jq '.public | length' "$work/body.json")"

          # 3. this run's OIDC token for the Worker (kept out of argv and the log)
          oidc="$(curl -sS --fail --retry 3 --retry-delay 2 --max-time 30 \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${AUDIENCE}" | jq -er '.value')"
          echo "::add-mask::${oidc}"
          printf 'Authorization: Bearer %s\n' "$oidc" > "$work/auth.hdr"
          unset oidc

          # 4. post it
          code="$(curl -sS --max-time 60 -o "$work/response.json" -w '%{http_code}' \
            -X POST -H @"$work/auth.hdr" -H 'Content-Type: application/json' \
            --data-binary @"$work/body.json" "$ENDPOINT")"
          echo "HTTP ${code}"
          cat "$work/response.json"; echo
          [ "$code" = "200" ]
